1 分钟</div><p>标签:
<a href=/tags/%E8%AE%A1%E5%88%92/>计划</a></p></div><div class="container markdown top-pad"><p>这两天感冒了。</p><p>先说说上个月吧。</p><p>完全就是渣渣，什么都没有改变，还是那副鸟样。</p><p>这个月不能这样子了。要开始好好弄，论文要写起来，thesis也是。</p><p>接下来这个月的计划：</p><ul><li>调整作息习惯，正常时间睡觉，正常时间起床</li><li>整理桌子</li><li>每天看论文，写一些thesis的内容</li><li>认真思考如何写论文</li><li>坚持锻炼</li><li>删了那些没用的手机游戏软件</li></ul></div><div class=container><hr></div><div class="container has-text-centered top-pad"><a href=#top><i class="fa fa-arrow-up"></i></a></div><div class=container><hr></div><div class=section id=footer><div class="container has-text-centered">花开彼岸天 · 鱼跃此时海</div></div></div></section><script src=https://hzhu.win/js/bundle.9f1477b8777751f58a8067ea8c685a70d1fad62a3c3c63c6b9fb067bf980d918.js integrity="sha256-nxR3uHd3UfWKgGfqjGhacNH61io8PGPGufsGe/mA2Rg="></script></body></html>

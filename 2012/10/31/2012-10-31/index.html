                                    <p>昨天，应该说是今天早上，我做了一个梦，一个让我觉得很陶醉的梦，印象中只有曾经有过一次，梦到一个女孩，非常甜美的对着我笑，那天，我醒来的时候，居然觉得非常的幸福。<br>昨天，我梦到了俞佳颖，我向她表白了，严格来说不能算是表白，只能算是告诉她，我曾经喜欢过她。然后，她说，她也曾动心过。<br>曾经，曾经<br>现在想来，无奈</p>

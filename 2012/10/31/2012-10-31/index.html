1 分钟</div><p>标签:
<a href=/tags/%E9%9A%8F%E6%83%B3%E5%BD%95/>随想录</a></p></div><div class="container markdown top-pad"><p>昨天，应该说是今天早上，我做了一个梦，一个让我觉得很陶醉的梦，印象中只有曾经有过一次，梦到一个女孩，非常甜美的对着我笑，那天，我醒来的时候，居然觉得非常的幸福。
昨天，我梦到了俞佳颖，我向她表白了，严格来说不能算是表白，只能算是告诉她，我曾经喜欢过她。然后，她说，她也曾动心过。
曾经，曾经
现在想来，无奈</p></div><div class=container><hr></div><div class="container has-text-centered top-pad"><a href=#top><i class="fa fa-arrow-up"></i></a></div><div class=container><hr></div><div class=section id=footer><div class="container has-text-centered">花开彼岸天 · 鱼跃此时海</div></div></div></section><script src=https://hzhu.win/js/bundle.9f1477b8777751f58a8067ea8c685a70d1fad62a3c3c63c6b9fb067bf980d918.js integrity="sha256-nxR3uHd3UfWKgGfqjGhacNH61io8PGPGufsGe/mA2Rg="></script></body></html>

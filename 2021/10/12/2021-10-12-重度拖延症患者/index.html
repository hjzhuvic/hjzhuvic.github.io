1 分钟</div><p>标签:
<a href=/tags/%E6%97%A0%E5%A4%84%E5%AE%89%E6%94%BE/>无处安放</a>
, <a href=/tags/%E7%B5%AE%E7%B5%AE%E5%8F%A8%E5%8F%A8/>絮絮叨叨</a></p></div><div class="container markdown top-pad"><h1 id=重度拖延症患者 class=anchor-link><a href=#%e9%87%8d%e5%ba%a6%e6%8b%96%e5%bb%b6%e7%97%87%e6%82%a3%e8%80%85>重度拖延症患者</a></h1><p>随着年纪的慢慢增大，感觉慢慢的失去了阅读的能力，失去了观察周围的能力。闲暇时间总是被各种“没有意义‘的资讯包围。Zhihui，weibo，etc.</p><p>而更加悲哀的事情是：慢慢的失去集中精神阅读长文的能力。</p><p>“以前我觉得成绩不重要。清华 、北大、复旦、交大 ，只能代表学生时代的成就。</p><p>后来我发现，努力是种习惯，它会贯穿终生。”</p></div><div class=container><hr></div><div class="container has-text-centered top-pad"><a href=#top><i class="fa fa-arrow-up"></i></a></div><div class=container><hr></div><div class=section id=footer><div class="container has-text-centered">花开彼岸天 · 鱼跃此时海</div></div></div></section><script src=https://hzhu.win/js/bundle.9f1477b8777751f58a8067ea8c685a70d1fad62a3c3c63c6b9fb067bf980d918.js integrity="sha256-nxR3uHd3UfWKgGfqjGhacNH61io8PGPGufsGe/mA2Rg="></script></body></html>
